        other: "less than %{count} minutes"
      less_than_x_seconds:
        zero: "less than a second"
        one: "less than a second"
        other: "less than %{count} seconds"
      over_x_years:
        one: "over 1 year"
        other: "over %{count} years"
      x_days:
        one: "1 day"
        other: "%{count} days"
      x_minutes:
        one: "1 minute"
        other: "%{count} minutes"
      x_months:
        one: "1 month"
        other: "%{count} months"
      x_seconds:
        one: "1 second"
        other: "%{count} seconds"
    prompts:
      day: "Day"
      hour: "Hour"
      minute: "Minute"
      month: "Month"
      second: "Seconds"
      year: "Year"

  number:
    currency:
      format:
        delimiter: ","
        format: "%u%n"
        precision: 2
        separator: "."
        significant: false
        strip_insignificant_zeros: false
        unit: "$"
    format:
      delimiter: ","
      precision: 3
      separator: "."
      significant: false
      strip_insignificant_zeros: false
    human:
      decimal_units:
        format: "%n %u"
        units:
          billion: "Billion"
          million: "Million"
          quadrillion: "Quadrillion"
          thousand: "Thousand"
          trillion: "Trillion"
          unit: ""
      format:
        delimiter: ""
        precision: 3
        significant: true
        strip_insignificant_zeros: true
      storage_units:
        format: "%n %u"
        units:
          byte:
            one: "Byte"
            other: "Bytes"
          gb: "GB"
          kb: "KB"
          mb: "MB"
          tb: "TB"
    percentage:
      format:
        delimiter: ""
    precision:
      format:
        delimiter: ""

  views:
    pagination:
      first: "&laquo; First"
      last: "Last &raquo;"
      previous: "&lsaquo; Previous"
      next: "Next &rsaquo;"
      truncate: "&hellip;"

  helpers:
    page_entries_info:
      one_page:
        display_entries:
          zero: "No %{entry_name} found"
          one: "Displaying <b>1</b> %{entry_name}"
          other: "Displaying <b>all %{count}</b> %{entry_name}"
      more_pages:
        display_entries: "Displaying %{entry_name} <b>%{first}&nbsp;-&nbsp;%{last}</b> of <b>%{total}</b> in total"

  vendors:
