<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DOM Benchmark Results</title>
<style>
  :root { color-scheme: light; --surface: #fcfcfb; --card: #ffffff; --border: #e4e3df; --text: #0b0b0b; --text2: #52514e; --grid: #ecebe7; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { color-scheme: dark; --surface: #1a1a19; --card: #222221; --border: #343432; --text: #ffffff; --text2: #c3c2b7; --grid: #2e2e2c; }
  }
  :root[data-theme="dark"] { color-scheme: dark; --surface: #1a1a19; --card: #222221; --border: #343432; --text: #ffffff; --text2: #c3c2b7; --grid: #2e2e2c; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px 16px; background: var(--surface); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .sub { color: var(--text2); margin: 0 0 16px; font-size: .9rem; }
  .legend { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 16px; color: var(--text2); font-size: .9rem; }
  .legend span::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; background: var(--c); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .card h2 { font-size: .95rem; font-weight: 600; margin: 0 0 8px; }
  .card .plot { position: relative; height: 220px; }
  table { border-collapse: collapse; width: 100%; font-size: .85rem; margin-top: 24px; }
  th, td { border-bottom: 1px solid var(--border); padding: 6px 8px; text-align: right; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--text2); font-weight: 600; }
  .table-wrap { overflow-x: auto; }
</style>
</head>
<body>
<main>
  <h1>DOM Benchmark Results</h1>
  <p class="sub" id="sub"></p>
  <div class="legend" id="legend"></div>
  <div class="grid" id="grid"></div>
  <div class="table-wrap"><table id="table"></table></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
const DATA = {"labels":["React","Angular","Vue","Svelte"],"keys":["react","angular","vue","svelte"],"colors":[{"light":"#2a78d6","dark":"#3987e5"},{"light":"#eb6834","dark":"#d95926"},{"light":"#1baf7a","dark":"#199e70"},{"light":"#eda100","dark":"#c98500"}],"panels":[{"key":"render100","title":"Render 100 tasks (median ms)","unit":"ms","values":[{"median":4.8,"mean":4.57,"stdev":0.68,"min":3,"max":5.4},{"median":5,"mean":5.07,"stdev":0.41,"min":4.6,"max":6},{"median":5.6,"mean":5.54,"stdev":0.42,"min":4.4,"max":6},{"median":5.4,"mean":5.39,"stdev":0.21,"min":5.1,"max":5.8}]},{"key":"render500","title":"Render 500 tasks (median ms)","unit":"ms","values":[{"median":13.7,"mean":13.83,"stdev":0.51,"min":13.1,"max":14.7},{"median":17.7,"mean":17.86,"stdev":0.56,"min":17.1,"max":19.3},{"median":15.5,"mean":15.55,"stdev":0.52,"min":14.5,"max":16.5},{"median":17.9,"mean":17.83,"stdev":0.7,"min":16.4,"max":19.1}]},{"key":"render1000","title":"Render 1000 tasks (median ms)","unit":"ms","values":[{"median":26,"mean":26.19,"stdev":0.67,"min":25.2,"max":27.7},{"median":33.3,"mean":33.37,"stdev":0.57,"min":32.6,"max":34.8},{"median":30.5,"mean":30.35,"stdev":0.66,"min":29.4,"max":31.2},{"median":36.7,"mean":36.63,"stdev":0.61,"min":35.6,"max":37.4}]},{"key":"update50","title":"Update 50 tasks (of 1000) (median ms)","unit":"ms","values":[{"median":1.9,"mean":1.97,"stdev":0.18,"min":1.8,"max":2.3},{"median":2.1,"mean":2.12,"stdev":0.13,"min":1.9,"max":2.3},{"median":1.7,"mean":1.65,"stdev":0.2,"min":1.3,"max":1.9},{"median":1.8,"mean":1.79,"stdev":0.21,"min":1.4,"max":2.1}]},{"key":"delete50","title":"Delete 50 tasks (of 1000) (median ms)","unit":"ms","values":[{"median":1.9,"mean":1.97,"stdev":0.22,"min":1.6,"max":2.3},{"median":1.6,"mean":1.57,"stdev":0.09,"min":1.4,"max":1.7},{"median":2.7,"mean":2.72,"stdev":0.08,"min":2.6,"max":2.9},{"median":2.7,"mean":2.77,"stdev":0.33,"min":2.4,"max":3.4}]},{"key":"memory","title":"JS heap with 1000 tasks (median MB)","unit":"MB","values":[{"median":3.18,"mean":3.18,"stdev":0,"min":3.17,"max":3.18},{"median":6.81,"mean":6.81,"stdev":0,"min":6.81,"max":6.81},{"median":5.06,"mean":5.06,"stdev":0,"min":5.06,"max":5.06},{"median":5.08,"mean":5.08,"stdev":0,"min":5.08,"max":5.08}]}],"meta":{"date":"2026-10-01T10:18:35.985Z","browser":"Chrome/154.0.8037.57","headless":true,"node":"v22.20.0","os":"Darwin 27.0.0 (arm64)","cpu":"Apple M1 Pro","cores":8,"ramGB":16,"iterations":15,"warmup":5,"memoryRuns":5,"timing":"update = performance.now() from button.click() until framework flush (setTimeout 0) + forced style/layout (offsetHeight); frame = until next rendered frame (rAF + setTimeout 0)","domStructureIdentical":true,"rowSignatures":{"react":"li.task[data-id,data-testid](span.task-name[] span.badge.priority-low[data-testid] button.edit[data-testid] button.remove[data-testid])","angular":"li.task[data-id,data-testid](span.task-name[] span.badge.priority-low[data-testid] button.edit[data-testid] button.remove[data-testid])","vue":"li.task[data-id,data-testid](span.task-name[] span.badge.priority-low[data-testid] button.edit[data-testid] button.remove[data-testid])","svelte":"li.task[data-id,data-testid](span.task-name[] span.badge.priority-low[data-testid] button.edit[data-testid] button.remove[data-testid])"}}};
const dark = () => getComputedStyle(document.documentElement).colorScheme.includes('dark');
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const m = DATA.meta;
document.getElementById('sub').textContent = m.browser + ' · ' + m.cpu + ' · ' + m.iterations + ' iterations after ' + m.warmup + ' warm-up · bars show the median, hover for mean ± stdev';
document.getElementById('legend').innerHTML = DATA.labels.map((l, i) => '<span style="--c:' + DATA.colors[i][dark() ? 'dark' : 'light'] + '">' + l + '</span>').join('');

// direct value labels above each bar (text in ink colour, not series colour)
const valueLabels = { id: 'valueLabels', afterDatasetsDraw(chart) {
  const { ctx } = chart; ctx.save(); ctx.fillStyle = css('--text2'); ctx.font = '12px system-ui'; ctx.textAlign = 'center';
  chart.getDatasetMeta(0).data.forEach((bar, i) => ctx.fillText(chart.data.datasets[0].data[i].toFixed(chart.$unit === 'MB' ? 2 : 1), bar.x, bar.y - 6));
  ctx.restore(); } };

const grid = document.getElementById('grid');
if (window.Chart) {
  for (const p of DATA.panels) {
    const card = document.createElement('div'); card.className = 'card';
    card.innerHTML = '<h2>' + p.title + '</h2><div class="plot"><canvas role="img" aria-label="' + p.title + '"></canvas></div>';
    grid.appendChild(card);
    const chart = new Chart(card.querySelector('canvas'), {
      type: 'bar',
      data: { labels: DATA.labels, datasets: [{ data: p.values.map((v) => v.median), backgroundColor: DATA.colors.map((c) => c[dark() ? 'dark' : 'light']), borderRadius: { topLeft: 4, topRight: 4 }, borderSkipped: 'bottom', maxBarThickness: 48 }] },
      options: {
        maintainAspectRatio: false, layout: { padding: { top: 18 } },
        plugins: { legend: { display: false }, tooltip: { callbacks: { label: (c) => { const v = p.values[c.dataIndex]; return 'median ' + v.median + ' ' + p.unit + ' · mean ' + v.mean + ' ± ' + v.stdev + ' · min ' + v.min + ' · max ' + v.max; } } } },
        scales: { x: { grid: { display: false }, ticks: { color: css('--text2') } }, y: { beginAtZero: true, grid: { color: css('--grid') }, border: { display: false }, ticks: { color: css('--text2') }, title: { display: true, text: p.unit, color: css('--text2') } } },
      },
      plugins: [valueLabels],
    });
    chart.$unit = p.unit;
  }
} else {
  grid.innerHTML = '<p>Chart.js could not be loaded (offline?) - see the table below or chart.svg.</p>';
}

// table view
const t = document.getElementById('table');
t.innerHTML = '<thead><tr><th>Metric (median)</th>' + DATA.labels.map((l) => '<th>' + l + '</th>').join('') + '</tr></thead><tbody>' +
  DATA.panels.map((p) => '<tr><td>' + p.title + '</td>' + p.values.map((v) => '<td>' + v.median.toFixed(2) + '</td>').join('') + '</tr>').join('') + '</tbody>';
</script>
</body>
</html>
