# CI for the "Cloud-Based Web System Design" capstone (VaxTrack).
# Runs only when files in CloudBasedWebSystemDesign/ change.
name: VaxTrack CI (CloudBasedWebSystemDesign)

on:
  push:
    branches: [main]
    paths:
      - "CloudBasedWebSystemDesign/**"
      - ".github/workflows/cloud-web-system-ci.yml"
  pull_request:
    paths:
      - "CloudBasedWebSystemDesign/**"
      - ".github/workflows/cloud-web-system-ci.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: CloudBasedWebSystemDesign

jobs:
  test:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vaxtrack_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vaxtrack_test?schema=public
      JWT_SECRET: ci-secret-ci-secret-ci-secret-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: CloudBasedWebSystemDesign/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Apply database migrations
        run: npm run db:deploy
      - name: API tests (unit + integration) with coverage
        run: npm run test:coverage -w apps/api
      - name: Web component tests
        run: npm run test -w apps/web
      - run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: CloudBasedWebSystemDesign
          push: false
          tags: vaxtrack:ci
          cache-from: type=gha,scope=vaxtrack
          cache-to: type=gha,mode=max,scope=vaxtrack
