        performance_title: "Performance"
        performance_body: "Des outils efficaces pour vendre vite, livrer mieux, et grandir avec son business."
        trust_title: "Confiance"
        trust_body: "Des paiements sécurisés et un service client réactif pour des transactions sereines."
