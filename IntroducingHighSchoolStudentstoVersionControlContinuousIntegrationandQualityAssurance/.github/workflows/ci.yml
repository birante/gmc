# CI pipeline for the Student Gradebook project (standalone-repo version).
# Runs on every push and pull request: install -> lint -> format check -> tests + coverage -> build.
# Notifications:
#   - GitHub shows a green check / red cross on the commit & PR and emails the pusher on failure
#     (Settings > Notifications > Actions on github.com).
#   - A job summary is written to the run page ($GITHUB_STEP_SUMMARY).
#   - Optional: add a SLACK_WEBHOOK_URL or DISCORD_WEBHOOK_URL repository secret to get chat messages.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-node-${{ matrix.node-version }}
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Gradebook CI - Node ${{ matrix.node-version }}"
            echo ""
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Result | **${{ job.status }}** |"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Triggered by | @${{ github.actor }} |"
            if [ -f coverage/coverage-summary.json ]; then
              node -e "const t=require('./coverage/coverage-summary.json').total; console.log('| Coverage (lines / branches / functions) | ' + t.lines.pct + '% / ' + t.branches.pct + '% / ' + t.functions.pct + '% |')"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  notify:
    name: Notify
    needs: build-and-test
    if: always()
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      RESULT: ${{ needs.build-and-test.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Overall result in summary
        run: |
          if [ "$RESULT" = "success" ]; then ICON="PASSED"; else ICON="FAILED"; fi
          echo "### Build $ICON for \`${{ github.ref_name }}\` - [view run]($RUN_URL)" >> "$GITHUB_STEP_SUMMARY"

      - name: Slack notification (optional)
        if: env.SLACK_WEBHOOK_URL != ''
        run: |
          curl -sS -X POST -H 'Content-Type: application/json' \
            --data "{\"text\":\"Gradebook CI *${RESULT}* on ${{ github.repository }}@${{ github.ref_name }} by ${{ github.actor }} - ${RUN_URL}\"}" \
            "$SLACK_WEBHOOK_URL"

      - name: Discord notification (optional)
        if: env.DISCORD_WEBHOOK_URL != ''
        run: |
          curl -sS -X POST -H 'Content-Type: application/json' \
            --data "{\"content\":\"Gradebook CI **${RESULT}** on ${{ github.repository }}@${{ github.ref_name }} by ${{ github.actor }} - ${RUN_URL}\"}" \
            "$DISCORD_WEBHOOK_URL"

      - name: Fail if the build failed
        if: needs.build-and-test.result != 'success'
        run: |
          echo "::error::Build or tests failed - see the build-and-test job logs."
          exit 1
