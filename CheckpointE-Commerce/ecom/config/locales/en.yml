      default: "%a, %d %b %Y %H:%M:%S %z"
      short: "%d %b %H:%M"
      long: "%B %d, %Y %H:%M"
    am: "am"
    pm: "pm"

  datetime:
    distance_in_words:
      about_x_hours:
        one: "about 1 hour"
        other: "about %{count} hours"
      about_x_months:
        one: "about 1 month"
        other: "about %{count} months"
