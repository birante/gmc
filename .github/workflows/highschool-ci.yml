# Monorepo version of IntroducingHighSchoolStudentstoVersionControlContinuousIntegrationandQualityAssurance/.github/workflows/ci.yml
# GitHub Actions only reads workflows from the repository root, so this file runs the
# Student Gradebook pipeline whenever files inside IntroducingHighSchoolStudentstoVersionControlContinuousIntegrationandQualityAssurance/ change.
name: HighSchool Gradebook CI

on:
  push:
    branches: ['**']
    paths:
      - 'IntroducingHighSchoolStudentstoVersionControlContinuousIntegrationandQualityAssurance/**'
      - '.github/workflows/highschool-ci.yml'
  pull_request:
    paths:
      - 'IntroducingHighSchoolStudentstoVersionControlContinuousIntegrationandQualityAssurance/**'
      - '.github/workflows/highschool-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: highschool-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: IntroducingHighSchoolStudentstoVersionControlContinuousIntegrationandQualityAssurance

jobs:
  build-and-test:
    name: Build & test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: IntroducingHighSchoolStudentstoVersionControlContinuousIntegrationandQualityAssurance/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: highschool-coverage-node-${{ matrix.node-version }}
          path: IntroducingHighSchoolStudentstoVersionControlContinuousIntegrationandQualityAssurance/coverage/
          if-no-files-found: ignore
          retention-days: 7

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Gradebook CI - Node ${{ matrix.node-version }}"
            echo ""
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Result | **${{ job.status }}** |"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Triggered by | @${{ github.actor }} |"
            if [ -f coverage/coverage-summary.json ]; then
              node -e "const t=require('./coverage/coverage-summary.json').total; console.log('| Coverage (lines / branches / functions) | ' + t.lines.pct + '% / ' + t.branches.pct + '% / ' + t.functions.pct + '% |')"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  notify:
    name: Notify
    needs: build-and-test
    if: always()
    runs-on: ubuntu-latest
    # No checkout in this job, so run from the default workspace instead of the project folder.
    defaults:
      run:
        working-directory: .
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      RESULT: ${{ needs.build-and-test.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Overall result in summary
        run: |
          if [ "$RESULT" = "success" ]; then ICON="PASSED"; else ICON="FAILED"; fi
          echo "### Build $ICON for \`${{ github.ref_name }}\` - [view run]($RUN_URL)" >> "$GITHUB_STEP_SUMMARY"

      - name: Slack notification (optional)
        if: env.SLACK_WEBHOOK_URL != ''
        run: |
          curl -sS -X POST -H 'Content-Type: application/json' \
            --data "{\"text\":\"Gradebook CI *${RESULT}* on ${{ github.repository }}@${{ github.ref_name }} by ${{ github.actor }} - ${RUN_URL}\"}" \
            "$SLACK_WEBHOOK_URL"

      - name: Discord notification (optional)
        if: env.DISCORD_WEBHOOK_URL != ''
        run: |
          curl -sS -X POST -H 'Content-Type: application/json' \
            --data "{\"content\":\"Gradebook CI **${RESULT}** on ${{ github.repository }}@${{ github.ref_name }} by ${{ github.actor }} - ${RUN_URL}\"}" \
            "$DISCORD_WEBHOOK_URL"

      - name: Fail if the build failed
        if: needs.build-and-test.result != 'success'
        run: |
          echo "::error::Build or tests failed - see the build-and-test job logs."
          exit 1
