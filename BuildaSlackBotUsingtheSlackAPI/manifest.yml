# Slack app manifest - HTTP mode (Events API Request URL).
# Replace https://YOUR-PUBLIC-URL with your ngrok / deployed URL before importing,
# or use manifest.socket-mode.yml for local development without a public URL.
display_information:
  name: GMC Bolt Bot
  description: GoMyCode checkpoint bot - replies to messages, handles /hello and logs channel messages.
  background_color: "#2c2d30"
features:
  bot_user:
    display_name: gmc-bolt-bot
    always_online: true
  slash_commands:
    - command: /hello
      url: https://YOUR-PUBLIC-URL/slack/events
      description: Say hello to the bot
      usage_hint: "[name]"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - channels:history
      - commands
settings:
  event_subscriptions:
    request_url: https://YOUR-PUBLIC-URL/slack/events
    bot_events:
      - message.channels
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
