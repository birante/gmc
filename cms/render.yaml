# Render blueprint — spins up the web service + a free managed Postgres.
# Push to a GitHub repo, then in Render dashboard: New -> Blueprint -> pick this repo.

databases:
  - name: educms-db
    plan: free
    databaseName: educms
    user: educms

services:
  - type: web
    name: educms
    env: ruby
    plan: free
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec puma -C config/puma.rb"
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: educms-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false                # set manually in Render dashboard
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: RUBY_VERSION
        value: "3.4.7"
      - key: BUNDLE_WITHOUT
        value: "development:test"
