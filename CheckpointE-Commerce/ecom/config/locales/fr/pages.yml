      history:
        tag: "Pourquoi aa existe ?"
        title: "Notre"
        title_highlight: "Histoire"
        body_1: "aa est née d'un constat simple : au Sénégal, le commerce est dynamique, mais vendre et acheter en ligne reste compliqué. Entre le manque de visibilité, la gestion des commandes et les difficultés de livraison, beaucoup de vendeurs peinent à développer leur activité, et les acheteurs ne trouvent pas toujours une expérience fiable et simple."
        body_2: "Grâce à une expérience concrète du terrain, au niveau local et à l'international, aa conçoit une solution plus simple et plus adaptée aux réalités du marché sénégalais."
      values:
        tag: "Nos valeurs"
