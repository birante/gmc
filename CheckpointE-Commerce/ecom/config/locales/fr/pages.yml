      intro:
        tag: "Notre raison d'être"
        title: "À propos de"
        body_1: "aa est une marketplace 100 %% sénégalaise qui réunit des milliers de boutiques locales et officielles. Notre ambition est de rendre le e-commerce accessible à tous, partout au Sénégal."
        body_2: "De la mise en ligne d'un produit jusqu'à la livraison du dernier kilomètre, nous simplifions chaque étape pour que vendeurs et acheteurs puissent se concentrer sur l'essentiel."
      mission:
        tag: "Notre mission"
        body: "Parce que vendre en ligne au Sénégal ne devrait pas être compliqué, aa simplifie chaque étape du e-commerce, pour les vendeurs comme pour les acheteurs."
