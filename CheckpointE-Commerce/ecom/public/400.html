<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Requete invalide (400) | aa</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }

      :root {
        --bg: #f7f2ff;
        --card: #ffffff;
        --text: #23103f;
        --muted: #665680;
        --brand: #551694;
        --brand-2: #6f24b8;
        --line: #e8ddf7;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at 10% 10%, #efe3ff 0%, transparent 30%),
          radial-gradient(circle at 90% 90%, #f0e7fb 0%, transparent 35%),
          var(--bg);
      }

      .card {
        width: min(760px, 100%);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 18px;
        box-shadow: 0 18px 40px rgba(50, 20, 90, 0.08);
        padding: 28px;
      }

      .brand {
        display: inline-block;
        font-weight: 800;
        letter-spacing: 0.5px;
        color: var(--brand);
        margin-bottom: 12px;
      }

      .code {
        display: inline-flex;
        align-items: center;
        border: 1px solid #d7c2f2;
        background: #f3eafd;
        color: var(--brand);
        border-radius: 999px;
        padding: 6px 12px;
        font-size: 13px;
        font-weight: 700;
        margin-bottom: 14px;
      }

      h1 {
        font-size: clamp(26px, 3.2vw, 38px);
        line-height: 1.15;
        margin-bottom: 10px;
      }

      p {
        color: var(--muted);
        font-size: 16px;
        line-height: 1.6;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 24px;
      }

      .btn {
        appearance: none;
        border: 0;
        border-radius: 10px;
        padding: 11px 16px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        text-decoration: none;
      }

      .btn-primary {
        color: #fff;
        background: linear-gradient(120deg, var(--brand), var(--brand-2));
      }

      .btn-secondary {
        color: var(--text);
        background: #f7f2ff;
        border: 1px solid #ded0f3;
      }

      .hint {
        margin-top: 16px;
        font-size: 13px;
        color: #7a6a93;
      }
    </style>
  </head>
  <body>
    <main class="card" role="main" aria-labelledby="title">
      <div class="brand">aa</div>
      <div class="code">Erreur 400</div>
      <h1 id="title">La requete semble invalide.</h1>
      <p>
        Nous n'avons pas pu traiter cette demande. Verifiez le lien utilise ou
        revenez a la page precedente puis reessayez.
      </p>

      <div class="actions">
        <a class="btn btn-primary" href="/">Retour a l'accueil</a>
        <button
          class="btn btn-secondary"
          type="button"
          onclick="window.location.reload()"
        >
          Reessayer
        </button>
      </div>

      <p class="hint">Code technique: HTTP 400 (Bad Request)</p>
    </main>
  </body>
</html>
