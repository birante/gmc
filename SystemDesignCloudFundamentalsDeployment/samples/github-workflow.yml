# .github/workflows/azure-deploy.yml — CI + deploy MERN app to Azure App Service.
#
# Prerequisites:
#   1. In the Azure Portal:
#      App Service -> "Get publish profile" -> download the .PublishSettings file.
#   2. In GitHub:
#      Repo -> Settings -> Secrets and variables -> Actions -> New repository secret.
#      Name it AZUREAPPSERVICE_PUBLISHPROFILE, paste the whole XML.

name: Build and deploy MERN app to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: my-mern-app          # replace with your App Service name
  NODE_VERSION:      "18.x"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install root deps
        run: npm ci

      - name: Build client + copy into server/public
        run: npm run build

      # (Optional) tests before deployment
      - name: Run tests
        run: npm test --if-present

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mern-app
          path: |
            server/
            package.json
            package-lock.json
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: production
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: mern-app

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name:        ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
          package:         .
